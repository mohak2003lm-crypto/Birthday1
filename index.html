<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>  ادعج خدلج</title>

<!-- معاينة عامة لمواقع التواصل (ما تكشف محتوى المعايدة) -->
<meta property="og:title" content="  ادعج خدلج" />
<meta property="og:description" content="" />
<meta property="og:image" content="preview.jpg" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content=" ادعج خدلج" />
<meta name="twitter:description" content=" " />
<meta name="twitter:image" content="preview.jpg" />
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Fredoka:wght@500;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#e9e3d4;
    font-family:'Cairo', sans-serif;
    padding:20px;
  }

  .card{
    position:relative;
    width:440px;
    max-width:100%;
    aspect-ratio: 440/620;
    background:#c7cd9e;
    border:14px solid #f2ead9;
    border-radius:6px;
    box-shadow:0 12px 30px rgba(0,0,0,0.15);
    overflow:hidden;
    padding:36px 30px 30px;
    display:flex; flex-direction:column; align-items:center;
    filter: blur(14px);
    transition: filter 0.8s ease;
  }
  .card.revealed{ filter: blur(0); }

  .reveal-overlay{
    position:fixed; inset:0;
    background:rgba(20,20,15,0.35);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    cursor:pointer;
    transition: opacity 0.6s ease;
  }
  .reveal-overlay.hidden{
    opacity:0;
    pointer-events:none;
  }
  .reveal-text{
    background:rgba(255,255,255,0.9);
    color:#2f6659;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:16px;
    padding:14px 26px;
    border-radius:30px;
    box-shadow:0 4px 14px rgba(0,0,0,0.2);
  }

  /* confetti dot border pattern on the outer edge */
  .card::before{
    content:"";
    position:absolute; inset:-14px;
    z-index:-1;
    background:
      radial-gradient(circle, #e9b7c9 3px, transparent 3.5px) 0 0/20px 20px,
      radial-gradient(circle, #a7c7dc 3px, transparent 3.5px) 10px 10px/20px 20px;
  }

  /* sun doodle top-left */
  .sun{ position:absolute; top:18px; left:20px; width:70px; height:70px; opacity:.85; }

  /* balloons top-right */
  .balloons{ position:absolute; top:14px; right:18px; display:flex; gap:6px; }
  .balloon{ width:38px; }

  h1.wish{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:30px;
    color:#2f6659;
    margin-top:66px;
    text-align:center;
  }

  /* ===== غيّر الاسم هنا فقط ===== */
  .name{
    display:flex; justify-content:center; gap:4px;
    margin-top:8px;
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:44px;
    line-height:1;
    direction:ltr;
  }
  .name span{ display:inline-block; }
  .name .n1{ color:#9aa63f; }
  .name .n2{ color:#3f6fa8; }
  .name .n3{ color:#2f6659; position:relative; }
  .name .n3 sup{ font-size:12px; position:absolute; top:-6px; left:-6px; color:#2f6659; }
  .name .n4{ color:#3f6fa8; }
  .name .n5{ color:#2f6659; }
  /* ================================ */

  .star-wrap{
    position:relative;
    margin:14px 0 6px;
    width:150px; height:150px;
    display:flex; align-items:center; justify-content:center;
  }
  .star-wrap svg{ position:absolute; inset:0; width:100%; height:100%; }
  .nickname{
    position:relative; z-index:2;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:15px;
    color:#3a2b3e;
  }

  .message{
    font-size:14.5px;
    line-height:2;
    color:#2b2b28;
    text-align:center;
    max-width:340px;
    margin-top:2px;
  }

  .footer-note{
    margin-top:auto;
    padding-top:24px;
    font-size:12.5px;
    font-weight:700;
    color:#b5462e;
    text-align:center;
  }

  .ribbon{
    position:absolute; bottom:10px; right:6px;
    width:110px; height:150px;
    opacity:.95;
  }

  .sound-btn{
    position:absolute; top:14px; left:14px;
    width:36px; height:36px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.55);
    font-size:16px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
    z-index:5;
  }
</style>
</head>
<body>

  <div class="card" id="card">

    <!-- Sun doodle -->
    <svg class="sun" viewBox="0 0 100 100">
      <g stroke="#3a3a35" stroke-width="2.5" fill="none" stroke-linecap="round">
        <circle cx="50" cy="50" r="18"/>
        <path d="M50 22 L50 5 M50 78 L50 95 M22 50 L5 50 M78 50 L95 50
                 M30 30 L18 18 M70 30 L82 18 M30 70 L18 82 M70 70 L82 82
                 M40 20 L34 6 M60 20 L66 6 M40 80 L34 94 M60 80 L66 94
                 M20 40 L6 34 M20 60 L6 66 M80 40 L94 34 M80 60 L94 66"/>
      </g>
    </svg>

    <!-- Balloons -->
    <svg class="balloons" width="120" height="90" viewBox="0 0 120 90">
      <g>
        <line x1="20" y1="30" x2="16" y2="80" stroke="#333" stroke-width="1"/>
        <circle cx="20" cy="20" r="16" fill="#e8c93a"/>
        <path d="M15 18a2 2 0 0 1 4 0M25 18a2 2 0 0 1 4 0M17 25 Q20 28 23 25" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>
      <g>
        <line x1="60" y1="34" x2="58" y2="82" stroke="#333" stroke-width="1"/>
        <circle cx="60" cy="24" r="17" fill="#5bb7c9"/>
        <path d="M54 22a2 2 0 0 1 4 0M64 22a2 2 0 0 1 4 0M56 29 Q60 33 64 29" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>
      <g>
        <line x1="98" y1="30" x2="100" y2="78" stroke="#333" stroke-width="1"/>
        <circle cx="98" cy="20" r="16" fill="#e8912e"/>
        <path d="M93 18a2 2 0 0 1 4 0M103 18a2 2 0 0 1 4 0M95 25 Q98 28 101 25" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>
    </svg>

    <h1 class="wish">Happy Birthday</h1>

    <div class="name">
      <span class="n1">N</span><span class="n2">o</span><span class="n3">u</span><span class="n4">r</span><span class="n5">a</span>
    </div>

    <div class="star-wrap">
      <svg viewBox="0 0 200 200">
        <polygon points="100,10 118,72 182,60 132,102 160,164 100,128 40,164 68,102 18,60 82,72"
                 fill="#e0498a" opacity="0.92"/>
      </svg>
      <div class="nickname">المملوحة ^_*</div>
    </div>

    <p class="message">
      اسف جنت ناوي اكعد اسوي صفحة حلوة<br>
      وملاعيب مدري شنو بس رجعت متاخر<br>
      ومالحك اسوي عالسنة الجاية بدالها عزيمة
    </p>

    <p class="footer-note">يرجى ارسال الامنيات لقسم تحقيق الاماني</p>

    <svg class="ribbon" viewBox="0 0 110 150">
      <path d="M70 0 C40 20 90 40 60 60 C30 80 80 100 55 120 C40 132 45 145 55 150"
            stroke="#3f6fa8" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M90 30 C65 45 100 60 78 78 C58 94 92 108 72 128"
            stroke="#a06fae" stroke-width="9" fill="none" stroke-linecap="round"/>
    </svg>

    <button id="soundBtn" class="sound-btn" aria-label="تشغيل الموسيقى">🔇</button>
    <audio id="bgSong" src="song.mp3" loop></audio>

  </div>

  <div class="reveal-overlay" id="revealOverlay">
    <div class="reveal-text">دوسي</div>
  </div>

  <script>
    const audio = document.getElementById('bgSong');
    const btn = document.getElementById('soundBtn');
    const card = document.getElementById('card');
    const overlay = document.getElementById('revealOverlay');

    function setPlayingUI(isPlaying){
      btn.textContent = isPlaying ? '🔊' : '🔇';
    }

    overlay.addEventListener('click', () => {
      card.classList.add('revealed');
      overlay.classList.add('hidden');
      audio.play().then(() => setPlayingUI(true)).catch(() => setPlayingUI(false));
    });

    // Manual toggle in case the browser blocked audio.
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if(audio.paused){
        audio.play().then(() => setPlayingUI(true)).catch(() => {});
      } else {
        audio.pause();
        setPlayingUI(false);
      }
    });
  </script>

</body>
</html>
